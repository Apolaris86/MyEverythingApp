<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24476E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<!--APP-START-->
<title>MyEverythingApp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sidebar nav on desktop, bottom tab bar on phones; each section is one scrolling column of cards. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#E9ECF0; --ink:#121B28; --muted:#5B6575; --line:#DADFE6;
  --accent:#24476E; --accent-ink:#FFFFFF; --accent-soft:#E2EAF3;
  --str:#3B7A51; --bike:#C8701C; --run:#C0403A; --swim:#1F6DAF; --rest:#8A93A3; --on-sport:#FFFFFF;
  --str-t:#E7F0E9; --bike-t:#FBEEDF; --run-t:#F8E4E3; --swim-t:#E0EBF5;
  --good:#2E7D4F; --bad:#B8362E;
  --ph1:#A9B8C8; --ph2:#6E89A8; --ph3:#2F4A68; --ph4:#121C2A;
  --ph-fg1:#121B28; --ph-fg2:#FFFFFF; --ph-fg3:#FFFFFF; --ph-fg4:#FFFFFF;
  --f-head:"Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; --nav-w:224px; --tab-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1319; --surface:#161D27; --surface-2:#202936; --ink:#E6EAF0; --muted:#97A1B1; --line:#2A3443;
  --accent:#8FB0D8; --accent-ink:#0E1319; --accent-soft:#1E2C3E;
  --str:#6DBB88; --bike:#EE9C4E; --run:#EE766C; --swim:#5EA6E6; --rest:#7D8698; --on-sport:#0E1319;
  --str-t:#18261D; --bike-t:#2B2116; --run-t:#2C1B1B; --swim-t:#14233A;
  --good:#5CC285; --bad:#EE6A60;
  --ph1:#3B4A5C; --ph2:#5A7596; --ph3:#8DA7C6; --ph4:#D4DDE8;
  --ph-fg1:#E6EAF0; --ph-fg2:#FFFFFF; --ph-fg3:#0E1319; --ph-fg4:#0E1319; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1319; --surface:#161D27; --surface-2:#202936; --ink:#E6EAF0; --muted:#97A1B1; --line:#2A3443;
  --accent:#8FB0D8; --accent-ink:#0E1319; --accent-soft:#1E2C3E;
  --str:#6DBB88; --bike:#EE9C4E; --run:#EE766C; --swim:#5EA6E6; --rest:#7D8698; --on-sport:#0E1319;
  --str-t:#18261D; --bike-t:#2B2116; --run-t:#2C1B1B; --swim-t:#14233A;
  --good:#5CC285; --bad:#EE6A60;
  --ph1:#3B4A5C; --ph2:#5A7596; --ph3:#8DA7C6; --ph4:#D4DDE8;
  --ph-fg1:#E6EAF0; --ph-fg2:#FFFFFF; --ph-fg3:#0E1319; --ph-fg4:#0E1319; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:2.1rem;line-height:1.05;text-transform:uppercase;letter-spacing:.005em}
h2{font-size:1.3rem}
h3{font-size:1.1rem}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* Shell */
.app{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);min-height:100%}
.nav{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;padding:20px 12px;border-right:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px;font-family:var(--f-head);font-weight:700;font-size:1.3rem;text-transform:uppercase}
.brand-mark{width:28px;height:28px;border-radius:4px;font-size:.95rem!important;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-size:.8rem}
.nav a,.nav .navbtn{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;border:0;background:none;width:100%;text-align:left}
.nav a:hover,.nav .navbtn:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:20px;height:20px;flex:none}
.nav .spacer{flex:1}
main{min-width:0;padding-block:28px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.page{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.page-head p{margin:4px 0 0}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:fixed;inset:auto 0 0 0;top:auto;height:auto;flex-direction:row;justify-content:space-around;gap:0;z-index:20;
    padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
    border-right:0;border-top:1px solid var(--line)}
  .brand,.nav .spacer{display:none}
  .nav a,.nav .navbtn{flex-direction:column;gap:2px;font-size:.7rem;padding:6px 4px;justify-content:center;align-items:center;text-align:center;width:auto;flex:1}
  main{padding-block:20px calc(var(--tab-h) + 32px + env(safe-area-inset-bottom, 0px))}
  h1{font-size:1.7rem}
}

/* Cards & controls */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{text-decoration:none;display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--bad)}
.iconbtn{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;display:grid;place-items:center}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
input[type=text],input[type=number],input[type=date],input[type=month],select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:8px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.pill.sample{background:var(--accent-soft);color:var(--accent)}
.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* Check */
.check{width:24px;height:24px;flex:none;border-radius:7px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.check svg{width:14px;height:14px;opacity:0}
.check[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.check[aria-pressed="true"] svg{opacity:1}

/* Sport colours follow the printed plan: strength green, bike orange, run red, swim blue, Sunday orange-to-red. */
.sport{--c:var(--rest);display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--c)}
.sport::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--c)}
.s-swim,.sp-swim{--c:var(--swim);--tint:var(--swim-t)} .s-bike,.sp-bike{--c:var(--bike);--tint:var(--bike-t)} .s-run,.sp-run{--c:var(--run);--tint:var(--run-t)}
.s-strength,.sp-strength{--c:var(--str);--tint:var(--str-t)} .s-brick,.sp-brick{--c:var(--bike);--tint:var(--bike-t)} .s-race,.sp-race{--c:var(--ink);--tint:var(--surface-2)} .s-rest,.sp-rest{--c:var(--rest);--tint:var(--surface-2)}
.s-brick::before{background:linear-gradient(135deg,var(--bike) 50%,var(--run) 50%)}
.mono{font-family:var(--f-mono)}

/* Today */
.hero-session{display:grid;gap:10px;border-top:5px solid var(--c)}
.sp-brick.hero-session{border-image:linear-gradient(90deg,var(--bike),var(--run)) 1;border-image-slice:1;border-top-width:5px}
.hero-session .big{font-family:var(--f-head);font-size:1.7rem;font-weight:700;line-height:1.1}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-head);font-size:1.7rem;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mini-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.mini-list li{display:flex;gap:10px;align-items:center;min-width:0}
.mini-list li span.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.test-badge{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;border:1.5px solid var(--ink);border-radius:3px;padding:2px 8px;font-size:.78rem;font-weight:600;background:var(--surface)}
.test-badge b{font-family:var(--f-head);text-transform:uppercase;letter-spacing:.04em;font-size:.85rem}

/* Training: 26 weeks at a glance */
.page.wide{max-width:1180px}
.glance{display:grid;grid-template-columns:repeat(26,minmax(0,1fr));gap:3px;align-items:end;height:64px;margin-top:14px}
.glance button{position:relative;height:100%;border:0;border-radius:1px;padding:0 0 4px;display:flex;align-items:flex-end;justify-content:center;font:500 .66rem var(--f-mono);background:var(--c);color:var(--fg);min-width:0}
.glance button.light{height:44%}
.glance [data-ph="1"],.glance-labels [data-ph="1"]{--c:var(--ph1);--fg:var(--ph-fg1)}
.glance [data-ph="2"],.glance-labels [data-ph="2"]{--c:var(--ph2);--fg:var(--ph-fg2)}
.glance [data-ph="3"],.glance-labels [data-ph="3"]{--c:var(--ph3);--fg:var(--ph-fg3)}
.glance [data-ph="4"],.glance-labels [data-ph="4"]{--c:var(--ph4);--fg:var(--ph-fg4)}
.glance button[aria-current="true"]{outline:2px solid var(--ink);outline-offset:2px;z-index:1}
.glance button.now::after{content:"";position:absolute;top:-9px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:50%;background:var(--good)}
.glance-labels{display:grid;grid-template-columns:repeat(26,minmax(0,1fr));gap:3px;margin-top:10px}
.glance-labels div{border-top:3px solid var(--c);padding-top:6px;min-width:0}
.glance-labels b{display:block;font:700 .95rem/1.1 var(--f-head);text-transform:uppercase;letter-spacing:.02em}
.glance-labels small{font:400 .7rem var(--f-mono);color:var(--muted)}
.glance-key{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--muted);margin-top:12px}
.glance-key .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:1px}
@media (max-width:640px){.glance{height:48px;gap:2px}.glance button{font-size:0;padding:0}.glance-labels{gap:2px}.glance-labels b{font-size:.75rem}.glance-labels small{display:none}}

/* Training: week view */
.week-head{display:flex;flex-direction:column;gap:12px}
.week-title{display:flex;align-items:center;gap:6px}
.week-title h2{font-size:1.5rem}
.vol{display:flex;flex-wrap:wrap;gap:8px}
.vol .pill{font-size:.78rem}
.note{font-size:.88rem;color:var(--muted)}
.days{display:flex;flex-direction:column;gap:10px}
.dcard{display:grid;grid-template-columns:150px minmax(0,1fr) auto;border-radius:var(--r);overflow:hidden;background:var(--tint);border:1px solid var(--line)}
.dcard.sp-brick{background:linear-gradient(90deg,var(--bike-t),var(--run-t))}
.dcard .dh{background:var(--c);color:var(--on-sport);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.dcard.sp-brick .dh{background:linear-gradient(135deg,var(--bike),var(--run))}
.dcard.sp-race .dh{background:var(--ink);color:var(--bg)}
.dh b{font:700 1.35rem/1 var(--f-head);text-transform:uppercase;letter-spacing:.02em}
.dh small{font-size:.8rem;opacity:.95}
.dh .date{font:500 .72rem var(--f-mono);opacity:.9;margin-top:4px}
.dcard .db{padding:12px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.dcard .db .title{font-weight:600;font-size:1rem}
.dcard .db .sub{font-size:.82rem;color:var(--muted)}
.dcard .db ul{margin:6px 0 0;padding-left:18px;font-size:.86rem;color:var(--muted)}
.dcard .db ul li+li{margin-top:2px}
.dcard .chk{padding:12px 14px}
.dcard.is-today{outline:2px solid var(--accent);outline-offset:2px}
.dcard.is-light .db .title{color:var(--muted);font-weight:500}
.dcard.is-done .db{opacity:.6}
.today-tag{display:inline-block;margin-top:6px;font:700 .72rem var(--f-mono);text-transform:uppercase;background:var(--surface);color:var(--ink);padding:1px 6px;border-radius:3px;align-self:flex-start}
details.more summary{cursor:pointer;color:var(--accent);font-size:.84rem;list-style:none;font-weight:500}
details.more summary::-webkit-details-marker{display:none}
@media (max-width:640px){
  .dcard{grid-template-columns:minmax(0,1fr) auto}
  .dcard .dh{grid-column:1/-1;flex-direction:row;align-items:baseline;flex-wrap:wrap;gap:4px 10px;padding:9px 14px}
  .dh .date{margin:0 0 0 auto}
  .today-tag{margin:0}
}

/* Training: full plan table (mirrors the printed plan) */
.plan-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.plan-table{border-collapse:separate;border-spacing:0;min-width:1120px;width:100%;font-size:.82rem;line-height:1.35}
.plan-table th{text-align:left;padding:8px 10px;vertical-align:bottom;font-weight:500}
.plan-table th.meta{font:500 .68rem var(--f-mono);color:var(--muted);text-transform:uppercase;border-bottom:2px solid var(--ink)}
.plan-table th.sh{background:var(--c);color:var(--on-sport);width:12%}
.plan-table th.sp-brick{background:linear-gradient(135deg,var(--bike),var(--run))}
.plan-table th.sh b{display:block;font:700 1.15rem/1.05 var(--f-head);text-transform:uppercase}
.plan-table th.sh span{font-size:.72rem;opacity:.95}
.plan-table td{padding:9px 10px;vertical-align:top;border-bottom:1px solid var(--line)}
.plan-table td.c{background:var(--tint)}
.plan-table td.sp-brick{background:linear-gradient(90deg,var(--bike-t),var(--run-t))}
.plan-table tr.light td.c{color:var(--muted)}
.plan-table td.test{box-shadow:inset 0 0 0 1.5px var(--ink);font-weight:600;color:var(--ink)}
.plan-table td.race{background:var(--ink);color:var(--bg);font:700 1.25rem/1.1 var(--f-head);text-transform:uppercase;vertical-align:middle}
.plan-table td.wk{white-space:nowrap}
.plan-table td.wk button{border:0;background:none;padding:0 6px;border-radius:3px;font:700 1.45rem/1.1 var(--f-head);color:var(--ink)}
.plan-table td.wk button:hover{background:var(--surface-2)}
.plan-table tr.now td.wk button{background:var(--ink);color:var(--bg)}
.plan-table td.wk .arrow{font:700 1rem var(--f-head);color:var(--muted)}
.plan-table td.starts{font:400 .72rem var(--f-mono);color:var(--muted);white-space:nowrap}
.plan-table td.notes{font-size:.76rem;color:var(--muted);width:11%}
.plan-table .core{display:block;font-size:.72rem;color:var(--muted);margin-top:2px}
.plan-table .tick{color:var(--good);font-weight:700;margin-left:4px}
.plan-key{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.76rem;color:var(--muted);padding:10px 2px 0}
.plan-key i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.plan-key .box{display:inline-block;width:12px;height:10px;border:1.5px solid var(--ink);margin-right:5px;vertical-align:-1px}

/* Training: guide */
.guide{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start}
.guide .card{display:flex;flex-direction:column;gap:10px;min-width:0}
.guide h2{font-size:1.25rem;text-transform:uppercase;letter-spacing:.02em}
.gtable{width:100%;border-collapse:collapse;font-size:.86rem}
.gtable th{font:500 .66rem var(--f-mono);text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
.gtable td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.gtable tr:last-child td{border-bottom:0}
.gtable tr.total td{font-weight:600;border-top:1.5px solid var(--ink)}
.guide ul{margin:0;padding-left:18px;font-size:.88rem;display:flex;flex-direction:column;gap:5px}
.pill.next{background:var(--accent-soft);color:var(--accent)}
.pill.past{background:transparent;border:1px solid var(--line)}
.gear{list-style:none;padding:0!important}
.gear li{display:flex;gap:10px;align-items:flex-start}
.gear li.done span{text-decoration:line-through;color:var(--muted)}

/* Todo */
.todo-form{display:grid;grid-template-columns:minmax(0,1fr) 150px auto;gap:8px}
.todo-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.todo-list li{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
.todo-list li:last-child{border-bottom:0}
.todo-list .t{flex:1;min-width:0;overflow-wrap:anywhere}
.todo-list li.done .t{text-decoration:line-through;color:var(--muted)}
.todo-list button.t{border:0;background:none;padding:2px 0;text-align:left;font:inherit;color:inherit;cursor:text;border-radius:4px}
.todo-list button.t:hover{background:var(--surface-2)}
.todo-list li.editing{background:var(--accent-soft);border-radius:8px;padding:10px}
.edit-form{flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 150px 120px auto auto;gap:8px;align-items:center}
@media (max-width:640px){.edit-form{grid-template-columns:1fr 1fr}.edit-form #edit-text{grid-column:1/-1}}
.due{font-size:.78rem;color:var(--muted);white-space:nowrap}
.due.overdue{color:var(--bad);font-weight:600}
@media (max-width:560px){.todo-form{grid-template-columns:minmax(0,1fr) auto}.todo-form input[type=date]{grid-column:1}}

/* Finance */
.fin-form{display:grid;grid-template-columns:auto 110px minmax(0,1fr) minmax(0,1fr) 140px auto;gap:8px;align-items:center}
@media (max-width:860px){.fin-form{grid-template-columns:1fr 1fr}.fin-form .seg{grid-column:1/-1;justify-self:start}.fin-form .btn{grid-column:1/-1}}
.v.pos{color:var(--good)} .v.neg{color:var(--bad)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:120px minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:.88rem}
.bar-track{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:99px}
.tx-table{width:100%;border-collapse:collapse;font-size:.9rem}
.tx-table td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tx-table tr:last-child td{border-bottom:0}

<script>
(function(){
"use strict";

/* ---------- storage (localStorage, wrapped so the app still runs without it) ---------- */
const NS = "mea:";
const store = {
  get(k, d){ try{ const v = localStorage.getItem(NS+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(NS+k, JSON.stringify(v)); }catch(e){} }
};
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));

/* ---------- dates (all plan math in UTC days to dodge DST) ---------- */
const DAY = 86400000;
const pad = n => String(n).padStart(2,"0");
function todayISO(){ const d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function toUTC(iso){ const [y,m,d] = iso.split("-").map(Number); return Date.UTC(y,m-1,d); }
function fromUTC(t){ const d = new Date(t); return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate()); }
function addDays(iso, n){ return fromUTC(toUTC(iso) + n*DAY); }
const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DOW_LONG = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MON_LONG = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function dowIndex(iso){ return (new Date(toUTC(iso)).getUTCDay() + 6) % 7; }
function shortDate(iso){ const [,m,d] = iso.split("-").map(Number); return d+" "+MON[m-1]; }

/* ---------- state ---------- */
const state = {
  settings: store.get("settings", null),
  training: store.get("training", { done:{} }),
  todos: store.get("todos", null),
  tx: store.get("tx", null),
  ui: { todoList:"personal", week:null, month:null, txType:"expense", tview:"week" }
};
if(!state.settings){ state.settings = { raceDate:"2027-05-02", raceName:"Ironman 70.3", currency:"EUR", planVersion:2 }; store.set("settings", state.settings); }
if(state.settings.planVersion !== 2){
  // v1 used a 16-week sample plan; switch to the real 26-week plan and clear old ticks.
  Object.assign(state.settings, {raceDate:"2027-05-02", raceName:"Ironman 70.3", planVersion:2});
  state.training = {done:{}, gear:{}};
  store.set("settings", state.settings); store.set("training", state.training);
}
if(!state.training.gear) state.training.gear = {};
if(!state.todos){ state.todos = sampleTodos(); store.set("todos", state.todos); }
if(!state.tx){ state.tx = sampleTx(); store.set("tx", state.tx); }
const save = k => store.set(k, state[k]);

function sampleTodos(){
  const t = todayISO();
  return [
    {id:uid(), list:"personal", text:"Book bike service before Build phase", due:addDays(t,5), done:false, sample:true, created:Date.now()},
    {id:uid(), list:"personal", text:"Buy gels and electrolytes for long sessions", due:"", done:false, sample:true, created:Date.now()+1},
    {id:uid(), list:"personal", text:"Renew triathlon federation licence", due:addDays(t,20), done:false, sample:true, created:Date.now()+2},
    {id:uid(), list:"work", text:"Send Q4 status report", due:addDays(t,1), done:false, sample:true, created:Date.now()+3},
    {id:uid(), list:"work", text:"Prepare Monday stand-up notes", due:addDays(t,4), done:false, sample:true, created:Date.now()+4},
    {id:uid(), list:"work", text:"Review budget proposal", due:"", done:true, sample:true, created:Date.now()+5}
  ];
}
function sampleTx(){
  const ym = todayISO().slice(0,7);
  const d = n => ym+"-"+pad(n);
  const day = Math.max(1, Math.min(28, Number(todayISO().slice(8,10))));
  const s = (n) => d(Math.min(n, day));
  return [
    {id:uid(), type:"income", amount:3200, category:"Salary", note:"Monthly salary", date:s(1), sample:true},
    {id:uid(), type:"expense", amount:1100, category:"Housing", note:"Rent", date:s(1), sample:true},
    {id:uid(), type:"expense", amount:86.40, category:"Groceries", note:"Weekly shop", date:s(4), sample:true},
    {id:uid(), type:"expense", amount:129, category:"Training & gear", note:"Tri-suit", date:s(7), sample:true},
    {id:uid(), type:"expense", amount:45, category:"Transport", note:"Fuel", date:s(9), sample:true},
    {id:uid(), type:"expense", amount:64.10, category:"Groceries", note:"Weekly shop", date:s(11), sample:true},
    {id:uid(), type:"expense", amount:38.50, category:"Eating out", note:"Dinner", date:s(14), sample:true},
    {id:uid(), type:"expense", amount:25, category:"Bills", note:"Phone plan", date:s(15), sample:true},
    {id:uid(), type:"income", amount:240, category:"Freelance", note:"Side project", date:s(16), sample:true}
  ];
}

/* ---------- Ironman 70.3 plan: 26 weeks, Mon 2 Nov 2026 to race day Sun 2 May 2027 (from the PDF plan) ---------- */
const WEEKS = 26;
const LIGHT = [5, 9, 13, 17, 21];
const PHASES = [
  {n:1, name:"Recovery and base", from:1, to:9},
  {n:2, name:"Build", from:10, to:17},
  {n:3, name:"Specific and peak", from:18, to:24},
  {n:4, name:"Taper and race", from:25, to:26}
];
const phaseInfo = w => PHASES.find(p => w>=p.from && w<=p.to);
const phaseOf = w => phaseInfo(w).name;
const GOAL = "5:29:30";

// [tue ride, tue min, wed run, wed km, fri swim, swim m, sat km, sun text (null = "ride km → run km"), sun ride km, sun run km, note]
const WK = [null,
  ["45 min easy",45,"5 km easy",5,"1,000 m easy",1000,5,"40 km easy, no run",40,0,"Recovery week after Huskisson"],
  ["60 min Z2",60,"6 km easy, 4 strides",6,"1,500 m drills, 4×200",1500,8,null,50,3,""],
  ["60 min Z2",60,"7 km, 3×5 min tempo",7,"1,800 m",1800,10,null,55,4,""],
  ["70 min Z2",70,"8 km, 20 min tempo",8,"2,000 m, 400 m + 200 m time trial",2000,12,null,60,5,"Swim test on Friday"],
  ["50 min easy",50,"6 km easy",6,"1,500 m",1500,8,null,45,3,"Lighter week"],
  ["75 min, 3×8 min tempo",75,"8 km, 5×3 min 10k effort",8,"2,000 m",2000,12,null,65,5,"Optional 2nd swim starts"],
  ["80 min, 3×10 min tempo",80,"9 km, 25 min tempo",9,"2,200 m",2200,13,null,70,6,""],
  ["85 min, 4×8 min tempo",85,"9 km, 6×3 min 10k effort",9,"2,400 m",2400,14,null,75,6,"Christmas week, move sessions around family"],
  ["60 min easy",60,"6 km easy",6,"1,800 m",1800,10,null,50,4,"Lighter week, New Year"],
  ["90 min, 3×10 min tempo",90,"10 km, 2×15 min tempo",10,"2,500 m",2500,14,null,80,6,"Start fuelling tests on Sundays"],
  ["90 min, 4×8 min tempo",90,"10 km, 6×4 min 10k effort",10,"2,600 m",2600,15,null,85,8,""],
  ["100 min, 3×12 min tempo",100,"11 km, 30 min tempo",11,"2,800 m",2800,16,null,90,8,""],
  ["60 min easy",60,"7 km easy",7,"2,000 m, 400 m + 200 m time trial",2000,11,null,60,5,"Lighter week. Swim test on Friday. Order wetsuit by 31 Jan"],
  ["100 min, 3×15 min tempo",100,"11 km, 2×15 min race pace",11,"2,800 m",2800,16,null,90,8,""],
  ["105 min, 4×10 min tempo",105,"12 km, 5×5 min hard",12,"3,000 m",3000,17,null,95,10,""],
  ["110 min, 2×20 min tempo",110,"12 km, 35 min tempo",12,"3,000 m",3000,18,null,100,10,"Ride test on Sunday. Running shoes broken in"],
  ["70 min easy",70,"8 km easy, strides",8,"2,200 m",2200,12,null,65,6,"Lighter week"],
  ["110 min, 3×15 min tempo",110,"12 km, 3×12 min race pace",12,"3,000 m in wetsuit",3000,18,null,100,10,"Wetsuit swims start"],
  ["115 min, 4×12 min tempo",115,"12 km, 6×5 min hard",12,"3,200 m with 1,900 m continuous at 2:00 /100 m",3200,19,null,105,10,"Swim test on Friday"],
  ["120 min, 2×25 min tempo",120,"13 km, 40 min race pace",13,"3,200 m",3200,20,null,105,12,"Ride and run test on Sunday"],
  ["75 min easy",75,"8 km easy",8,"2,200 m, 400 m + 200 m time trial",2200,12,null,70,6,"Lighter week. Swim test on Friday. Bike service"],
  ["120 min, 3×15 min race effort",120,"12 km, 2×20 min race pace",12,"3,200 m open water in wetsuit",3200,20,"100 km, last 60 km at race effort → 10 km at race pace",100,10,"Peak block starts"],
  ["120 min, 3×15 min race effort",120,"10 km, 4×6 min race pace",10,"3,000 m",3000,18,"105 km → 8 km at race pace",105,8,"Peak block"],
  ["105 min, 2×15 min race effort",105,"8 km, 3×8 min race pace",8,"2,500 m",2500,14,null,85,8,"Peak block ends"],
  ["75 min, 3×8 min race effort",75,"7 km, 3×5 min race pace, strides",7,"2,000 m",2000,10,null,55,5,"Taper, volume down about 40%"],
  ["45 min easy, 3×3 min race effort",45,"5 km easy, 4 strides",5,"1,000 m easy, 4×50 m fast",1000,0,null,0,0,"Race week, volume down about 60%"]
];

const TESTS = [
  {w:4,  d:4, test:"Swim 400 m then 200 m, all out", pass:"Record both. Sets your 100 m pace"},
  {w:13, d:4, test:"Swim 400 m then 200 m again", pass:"100 m pace at or under 1:55"},
  {w:16, d:6, test:"100 km ride, then 10 km run", pass:"Ride at 28.5 km/h or faster"},
  {w:19, d:4, test:"1,900 m continuous swim", pass:"38:00 at 2:00 /100 m, or within 1 min"},
  {w:20, d:6, test:"105 km ride, then 12 km run", pass:"Run at 5:15 /km or faster"},
  {w:21, d:4, test:"Swim 400 m then 200 m, final check", pass:"100 m pace at or under 1:50"}
];

const GEAR = [
  {id:"wetsuit", text:"Wetsuit (2XU or Orca, tall) ordered by 31 Jan and swum in by week 18"},
  {id:"shoes", text:"New running shoes broken in by week 16"},
  {id:"trisuit", text:"Trisuit (2XU Aero Hex Sleeved) worn on at least two long sessions before race day"},
  {id:"service", text:"Bike service in the week of 22 Mar"}
];

const UPPER_EX = ["Dumbbell pullover 3×8","Single-arm dumbbell row 3×10 each arm","Shoulder press 3×10","Dumbbell bench press 3×10","Dead bug 3×10","Plank 3×40 s"];
const LEGS_EX = ["Goblet squat 3×8","Dumbbell Romanian deadlift 3×8","Split squat 3×8 each leg","Calf raise 3×12","Side plank 3×40 s each side","Glute bridge 3×12"];
const CORE_CIRCUIT = "Core circuit, 2 rounds: dead bug 8 each side, plank 30 s, side plank 30 s each side, glute bridge 12";
const DAY_KIND = ["Strength, upper","Indoor ride","Run","Strength, legs","Swim","Long run","Long ride / brick"];

function strengthTitle(w, upper){
  if(w===1) return "Mobility only";
  if(w===25) return upper ? "Upper mobility + core, 15 to 20 min" : "Mobility + core, 15 to 20 min";
  if(w===26) return upper ? "Upper mobility + core, 15 min" : "Mobility + core, 15 min. Check bike, kit and race bag";
  const len = w<=9 ? "40 min" : w<=17 ? "35 min" : "25 to 30 min";
  return (upper ? "Upper" : "Legs") + " + core, " + len;
}
function strengthDetail(w, upper){
  const ex = upper ? UPPER_EX : LEGS_EX, light = LIGHT.includes(w);
  if(w===1) return ["Recovery week after Huskisson: easy mobility, no lifting"];
  if(w>=25) return ["Mobility and core only","No new exercises in the last three weeks"];
  const head = w<=9 ? (light ? ["Lighter week: two sets of each"] : [])
             : w<=17 ? ["Same lifts, heavier, 6 to 8 reps" + (light ? ". Two sets this week" : "")]
             : ["Two sets, hold the weights"];
  const knees = upper ? [] : ["Keep the knees tracking over the toes on squats and split squats"];
  return head.concat(ex, knees, ["Dumbbells and a bench. Mon and Thu can swap"]);
}
function rideHints(t){
  const h = ["Indoors on the KICKR"];
  if(/race effort/.test(t)) h.push("Race effort: steady, the effort that holds 30 km/h on the flat");
  if(/tempo/.test(t)) h.push("Tempo blocks: comfortably hard, controlled breathing");
  if(/Z2|easy/.test(t)) h.push("Z2 / easy: you could talk in full sentences");
  return h;
}
function runHints(t){
  const h = [];
  if(/easy/.test(t)) h.push("Easy: 5:50 to 6:20 /km, full sentences");
  if(/tempo/.test(t)) h.push("Tempo: 4:50 to 4:55 /km");
  if(/10k effort|hard/.test(t)) h.push("10k effort: 4:40 to 4:45 /km");
  if(/race pace/.test(t)) h.push("Race pace: 5:00 /km");
  if(/strides/.test(t)) h.push("Strides: about 20 s smooth and fast, walk back");
  if(!/^\d+ km easy/.test(t)) h.push("Run the rest of the distance easy around the quality block");
  return h;
}
function swimHints(w, t){
  const h = ["Main swim of the week. Race pace is 2:00 /100 m"];
  if(/time trial/.test(t)) h.push("Warm up, then swim 400 m and 200 m all out. Record both times");
  if(/1,900 m continuous/.test(t)) h.push("Race-distance swim: aim for 38:00");
  if(/wetsuit|open water/.test(t)) h.push("Wetsuit swim, open water if you can");
  if(w>=6 && w<=24) h.push("Optional second easy swim (1.5 to 2 km, technique) on Mon or Wed");
  if(w>=6 && w<=24) h.push("Open water at Balmoral every second Friday");
  return h;
}
function sundayHints(w, r){
  const h = ["Outdoors on the race bike" + (w>=18 ? ", in the race position" : "")];
  if(r[9]) h.push("Straight off the bike into the " + r[9] + " km run");
  if(w>=10) h.push("Fuelling test: 60 to 80 g carbs and 500 to 750 ml fluid per hour. Bulk Nutrients mix, INFINIT as backup");
  if(r[9]) h.push("Skip the run and ride only if a knee niggle shows up");
  h.push("Never drop the long ride two weeks in a row");
  return h;
}

function weekPlan(w){
  const r = WK[w], light = LIGHT.includes(w);
  const S = (d, sport, title, sub, detail) => ({sport, kind:DAY_KIND[d], title, sub:sub||"", detail, light, test:null});
  const days = [
    S(0, "strength", strengthTitle(w,true), "", strengthDetail(w,true)),
    S(1, "bike", r[0], w<=25 ? "+ 10 min core circuit" : "", rideHints(r[0]).concat(w<=25 ? [CORE_CIRCUIT, "If the week goes wrong, shorten this ride first"] : [])),
    S(2, "run", r[2], "", runHints(r[2])),
    S(3, "strength", strengthTitle(w,false), "", strengthDetail(w,false)),
    S(4, "swim", r[4], "", swimHints(w, r[4])),
    w===WEEKS ? Object.assign(S(5, "bike", "25 min spin, 3×1 min race effort, 10 min jog, rack the bike", "", ["Keep the legs awake, nothing more","Check transition and race bag"]), {kind:"Pre-race"})
              : S(5, "run", r[6] + " km", "", ["Easy effort, full sentences: 5:50 to 6:20 /km","Keep the long run and Sunday ride back to back"].concat(w>=10 ? ["Practise fuelling on the run"] : [])),
    w===WEEKS ? Object.assign(S(6, "race", (state.settings.raceName || "Ironman 70.3").toUpperCase(), "Target " + GOAL, [
                  "Swim 1,900 m: 2:05 /100 m for the first 300 m, then settle at 2:00",
                  "Bike 90 km: hold 30 km/h, steady effort, no surges on climbs or in the first 20 km",
                  "Run 21.1 km: first 3 km at 5:05 to 5:10 /km, then 5:00 /km. Push only in the last 5 km",
                  "Familiar breakfast 2 to 3 hours before the start. Nothing new on race day"]), {kind:"Race day"})
              : S(6, r[9] ? "brick" : "bike", r[7] || (r[8] + " km → " + r[9] + " km"), "", sundayHints(w, r))
  ];
  TESTS.filter(t => t.w===w).forEach(t => { days[t.d].test = t; });
  return days;
}
function weekVolume(w){ const r = WK[w]; return {swim:r[5], indoor:r[1], ride:r[8], run:r[3] + r[6] + r[9]}; }

function fmtMin(m){ if(!m) return "—"; const h = Math.floor(m/60), mm = m%60; return h ? (h+"h"+(mm?" "+mm+"m":"")) : mm+"m"; }
function planStart(){ const r = state.settings.raceDate; return addDays(r, -dowIndex(r) - (WEEKS-1)*7); }
function planPos(iso){
  const diff = Math.round((toUTC(iso) - toUTC(planStart())) / DAY);
  if(diff < 0) return {before:true, daysUntilStart:-diff};
  const w = Math.floor(diff/7) + 1;
  if(w > WEEKS) return {after:true};
  return {week:w, day:diff%7};
}
function dateOf(w, d){ return addDays(planStart(), (w-1)*7 + d); }
const doneKey = (w,d) => w+"-"+d;
const isDone = (w,d) => !!state.training.done[doneKey(w,d)];

/* ---------- money ---------- */
const CURRENCIES = {EUR:"Euro (€)", HUF:"Hungarian forint (Ft)", GBP:"Pound (£)", USD:"US dollar ($)"};
function money(n){
  try{ return new Intl.NumberFormat(undefined,{style:"currency",currency:state.settings.currency,maximumFractionDigits: state.settings.currency==="HUF"?0:2}).format(n); }
  catch(e){ return n.toFixed(2)+" "+state.settings.currency; }
}
const EXP_CATS = ["Housing","Groceries","Transport","Training & gear","Eating out","Bills","Health","Other"];
const INC_CATS = ["Salary","Freelance","Other income"];
function monthTx(ym){ return state.tx.filter(t => t.date.slice(0,7) === ym); }
function monthTotals(ym){
  let inc=0, exp=0; for(const t of monthTx(ym)){ if(t.type==="income") inc+=t.amount; else exp+=t.amount; }
  return {inc, exp, net:inc-exp};
}
function shiftMonth(ym, n){ let [y,m] = ym.split("-").map(Number); m += n; while(m<1){m+=12;y--} while(m>12){m-=12;y++} return y+"-"+pad(m); }
function monthLabel(ym){ const [y,m] = ym.split("-").map(Number); return MON_LONG[m-1]+" "+y; }

/* ---------- icons ---------- */
const ICON_CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
const ICON_X = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const ICON_EDIT = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>';
const ICON_L = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
const ICON_R = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
const sportLabel = s => ({swim:"Swim",bike:"Bike",run:"Run",strength:"Strength",brick:"Ride + run",race:"Race",rest:"Rest"}[s]);
const sportChip = s => '<span class="sport s-'+s+'">'+sportLabel(s)+'</span>';
const checkBtn = (pressed, action, attrs, label) => '<button type="button" class="check" aria-pressed="'+pressed+'" aria-label="'+esc(label)+'" data-action="'+action+'" '+attrs+'>'+ICON_CHECK+'</button>';

/* ---------- views ---------- */
const view = document.getElementById("view");

const testBadge = t => t ? '<span class="test-badge"><b>Test</b>'+esc(t.test)+' · '+esc(t.pass)+'</span>' : '';
const fmtNum = n => n.toLocaleString("en-GB");
const yearOf = iso => iso.slice(0,4);

function renderToday(){
  const t = todayISO(), di = dowIndex(t), pos = planPos(t);
  const [y,m,d] = t.split("-").map(Number);
  const daysToRace = Math.round((toUTC(state.settings.raceDate) - toUTC(t))/DAY);
  let planLine, sessionHTML;
  if(pos.week){
    const s = weekPlan(pos.week)[pos.day], done = isDone(pos.week,pos.day);
    planLine = "Week "+pos.week+" of "+WEEKS+" · "+phaseOf(pos.week)+(LIGHT.includes(pos.week)?" · lighter week":"");
    const tomorrow = pos.day<6 ? weekPlan(pos.week)[pos.day+1] : (pos.week<WEEKS ? weekPlan(pos.week+1)[0] : null);
    sessionHTML = '<div class="card hero-session sp-'+s.sport+'">'+
      '<div class="row between"><span class="label">Today · '+esc(s.kind)+'</span>'+sportChip(s.sport)+'</div>'+
      '<div class="big">'+esc(s.title)+'</div>'+
      (s.sub?'<div class="muted">'+esc(s.sub)+'</div>':'')+
      testBadge(s.test)+
      '<ul class="muted" style="margin:0;padding-left:18px;font-size:.9rem">'+s.detail.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>'+
      '<div class="row between" style="margin-top:4px">'+
        '<div class="row">'+checkBtn(done,"toggle-session",'data-w="'+pos.week+'" data-d="'+pos.day+'"',"Mark today’s session done")+'<span>'+(done?"Done, nice work":"Mark as done")+'</span></div>'+
        '<a class="btn small" href="#training">Full week</a>'+
      '</div>'+
      (tomorrow?'<div class="muted" style="font-size:.85rem;border-top:1px solid var(--line);padding-top:10px">Tomorrow: '+sportChip(tomorrow.sport)+' '+esc(tomorrow.title)+'</div>':'')+
    '</div>';
  } else {
    planLine = pos.before ? "Plan starts in "+pos.daysUntilStart+" days" : "Race done. Set your next race in Settings";
    sessionHTML = '<div class="card hero-session sp-rest"><span class="label">Training</span><div class="big">'+(pos.before?"Plan hasn’t started yet":"Plan complete")+'</div><a class="btn small" href="#training" style="justify-self:start">View plan</a></div>';
  }

  const open = state.todos.filter(x=>!x.done).sort(byDue);
  const p = open.filter(x=>x.list==="personal"), w = open.filter(x=>x.list==="work");
  const todoLi = x => '<li>'+checkBtn(false,"toggle-todo",'data-id="'+x.id+'"',"Complete "+x.text)+'<span class="t">'+esc(x.text)+'</span>'+dueTag(x.due)+'</li>';
  const ym = t.slice(0,7), mt = monthTotals(ym);

  view.innerHTML = '<div class="page">'+
    '<div class="page-head"><div><h1>'+DOW_LONG[di]+', '+d+' '+MON_LONG[m-1]+'</h1>'+
      '<p class="muted">'+planLine+(daysToRace>=0?' · <b class="num" style="color:var(--ink)">'+daysToRace+'</b> days to '+esc(state.settings.raceName):'')+'</p></div></div>'+
    '<div class="grid">'+sessionHTML+
      '<div class="card" style="display:flex;flex-direction:column;gap:14px">'+
        '<div class="row between"><span class="label">To do</span><a class="btn small ghost" href="#todo">Open lists</a></div>'+
        '<div><div class="row between"><h3>Personal</h3><span class="pill num">'+p.length+' open</span></div>'+
          (p.length?'<ul class="mini-list" style="margin-top:8px">'+p.slice(0,3).map(todoLi).join("")+'</ul>':'<p class="muted" style="margin:6px 0 0">All clear.</p>')+'</div>'+
        '<div><div class="row between"><h3>Work</h3><span class="pill num">'+w.length+' open</span></div>'+
          (w.length?'<ul class="mini-list" style="margin-top:8px">'+w.slice(0,3).map(todoLi).join("")+'</ul>':'<p class="muted" style="margin:6px 0 0">All clear.</p>')+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="card" style="display:flex;flex-direction:column;gap:14px">'+
      '<div class="row between"><span class="label">PekFinance · '+monthLabel(ym)+'</span><a class="btn small ghost" href="#finance">Open finance</a></div>'+
      '<div class="stats">'+
        '<div class="stat"><span class="muted" style="font-size:.85rem">Income</span><span class="v num">'+money(mt.inc)+'</span></div>'+
        '<div class="stat"><span class="muted" style="font-size:.85rem">Spent</span><span class="v num">'+money(mt.exp)+'</span></div>'+
        '<div class="stat"><span class="muted" style="font-size:.85rem">Net</span><span class="v num '+(mt.net>=0?'pos':'neg')+'">'+money(mt.net)+'</span></div>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function glanceHTML(w, pos){
  let bars = "";
  for(let i=1;i<=WEEKS;i++){
    const ph = phaseInfo(i).n;
    bars += '<button type="button" data-action="open-week" data-w="'+i+'" data-ph="'+ph+'" class="'+(LIGHT.includes(i)?'light':'')+(pos.week===i?' now':'')+'" aria-current="'+(i===w)+'" aria-label="Week '+i+', '+phaseOf(i)+(LIGHT.includes(i)?', lighter week':'')+'">'+i+'</button>';
  }
  const labels = PHASES.map(p => '<div data-ph="'+p.n+'" style="grid-column:'+p.from+' / '+(p.to+1)+'"><b>'+p.name+'</b><small>wk '+p.from+' to '+p.to+', '+shortDate(dateOf(p.from,0))+'</small></div>').join("");
  return '<div class="card"><div class="row between"><h2 style="text-transform:uppercase">'+WEEKS+' weeks at a glance</h2>'+
    '<span class="muted" style="font-size:.8rem">Tap a week to open it</span></div>'+
    '<div class="glance" role="group" aria-label="Plan weeks">'+bars+'</div><div class="glance-labels">'+labels+'</div>'+
    '<div class="glance-key"><span><span class="dot"></span>This week</span><span>Shorter bars are lighter weeks (5, 9, 13, 17, 21), cut by about a third</span></div></div>';
}

function weekHTML(w, t, pos){
  const plan = weekPlan(w), r = WK[w], v = weekVolume(w), light = LIGHT.includes(w);
  const doneCount = plan.filter((_,i)=>isDone(w,i)).length;
  const head = '<div class="card week-head">'+
    '<div class="row between">'+
      '<div class="week-title"><button class="iconbtn" type="button" data-action="week-prev" aria-label="Previous week"'+(w<=1?' disabled':'')+'>'+ICON_L+'</button>'+
      '<h2>Week '+w+(light?' ↓':'')+' · '+phaseOf(w)+'</h2>'+
      '<button class="iconbtn" type="button" data-action="week-next" aria-label="Next week"'+(w>=WEEKS?' disabled':'')+'>'+ICON_R+'</button></div>'+
      '<div class="row">'+(pos.week && pos.week!==w?'<button class="btn small" type="button" data-action="week-now">This week</button>':'')+
      '<span class="pill num">'+doneCount+' / 7 done</span></div>'+
    '</div>'+
    '<div class="vol num">'+
      '<span class="pill"><span class="sport s-swim">Swim</span> '+fmtNum(v.swim)+' m</span>'+
      '<span class="pill"><span class="sport s-bike">Bike</span> '+v.indoor+' min indoor'+(v.ride?' + '+v.ride+' km':'')+'</span>'+
      '<span class="pill"><span class="sport s-run">Run</span> '+v.run+' km</span>'+
      '<span class="pill mono">'+shortDate(dateOf(w,0))+' to '+shortDate(dateOf(w,6))+'</span>'+
    '</div>'+
    (r[10]?'<div class="note">'+esc(r[10])+'</div>':'')+
  '</div>';
  const days = plan.map((s,i)=>{
    const iso = dateOf(w,i), done = isDone(w,i), today = iso===t;
    return '<div class="dcard sp-'+s.sport+(today?' is-today':'')+(done?' is-done':'')+(s.light?' is-light':'')+'">'+
      '<div class="dh"><b>'+DOW[i]+'</b><small>'+esc(s.kind)+'</small><span class="date">'+shortDate(iso)+'</span>'+(today?'<span class="today-tag">Today</span>':'')+'</div>'+
      '<div class="db"><span class="title">'+esc(s.title)+'</span>'+(s.sub?'<span class="sub">'+esc(s.sub)+'</span>':'')+testBadge(s.test)+
        '<details class="more"'+(today?' open':'')+'><summary>Session details</summary><ul>'+s.detail.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul></details></div>'+
      '<div class="chk">'+checkBtn(done,"toggle-session",'data-w="'+w+'" data-d="'+i+'"',"Mark "+DOW_LONG[i]+" done")+'</div>'+
    '</div>';
  }).join("");
  return head + '<div class="days">'+days+'</div>';
}

function planTableHTML(pos){
  const hdr = '<tr><th class="meta">Wk</th><th class="meta">Starts</th>'+
    DAY_KIND.map((k,i)=>{ const sp = i===6?"brick":["strength","bike","run","strength","swim","run"][i]; return '<th class="sh sp-'+sp+'"><b>'+DOW[i]+'</b><span>'+k+'</span></th>'; }).join("")+
    '<th class="meta">Notes</th></tr>';
  let rows = "";
  for(let w=1; w<=WEEKS; w++){
    const plan = weekPlan(w), light = LIGHT.includes(w);
    const cells = plan.map((s,i)=>{
      const tick = isDone(w,i) ? '<span class="tick" aria-label="done">✓</span>' : '';
      if(s.sport==="race") return '<td class="race">'+esc(s.title)+tick+'</td>';
      return '<td class="c sp-'+s.sport+(s.test?' test':'')+'">'+esc(s.title)+tick+(s.sub?'<span class="core">'+esc(s.sub)+'</span>':'')+'</td>';
    }).join("");
    rows += '<tr class="'+(light?'light':'')+(pos.week===w?' now':'')+'">'+
      '<td class="wk"><button type="button" data-action="open-week" data-w="'+w+'" aria-label="Open week '+w+'">'+w+'</button>'+(light?'<span class="arrow">↓</span>':'')+'</td>'+
      '<td class="starts">'+shortDate(dateOf(w,0))+'</td>'+cells+'<td class="notes">'+esc(WK[w][10])+'</td></tr>';
  }
  return '<div class="plan-wrap"><table class="plan-table"><thead>'+hdr+'</thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="plan-key"><span class="sp-bike"><i></i>Bike</span><span class="sp-run"><i></i>Run</span><span class="sp-swim"><i></i>Swim</span><span class="sp-strength"><i></i>Strength</span>'+
    '<span>Sunday: ride km → brick run km</span><span>Core: Mon, Tue circuit, Thu</span><span>Z2 = easy, full sentences</span><span>↓ = lighter week</span><span><span class="box"></span>Test session</span><span><span class="tick">✓</span> done</span></div>';
}

function guideHTML(t){
  const nextTest = TESTS.find(x => dateOf(x.w,x.d) >= t);
  const testRows = TESTS.map(x=>{
    const iso = dateOf(x.w,x.d), past = iso < t;
    return '<tr><td class="mono" style="white-space:nowrap">'+DOW[x.d]+' '+shortDate(iso)+'</td><td class="num">'+x.w+'</td><td>'+esc(x.test)+'</td><td>'+esc(x.pass)+'</td><td>'+
      (x===nextTest?'<span class="pill next">Next</span>':past?'<span class="pill past">Past</span>':'')+'</td></tr>';
  }).join("");
  const gear = state.training.gear || {};
  return '<div class="guide">'+
    '<div class="card"><h2>Race goal</h2><table class="gtable"><thead><tr><th>Leg</th><th>Distance</th><th>Target</th><th>Pace</th></tr></thead><tbody>'+
      '<tr><td>Swim</td><td class="num">1,900 m</td><td class="num">38:00</td><td class="num">2:00 /100 m</td></tr>'+
      '<tr><td>Bike</td><td class="num">90 km</td><td class="num">3:00:00</td><td class="num">30.0 km/h</td></tr>'+
      '<tr><td>Run</td><td class="num">21.1 km</td><td class="num">1:45:30</td><td class="num">5:00 /km</td></tr>'+
      '<tr><td>Transitions</td><td></td><td class="num">6:00</td><td></td></tr>'+
      '<tr class="total"><td>Total</td><td></td><td class="num">'+GOAL+'</td><td></td></tr></tbody></table>'+
      '<p class="muted" style="margin:0;font-size:.82rem">Huskisson pace held over the full distance gives about 6:06. Fallback if the week 20 test shows a 5:15 /km run: about 5:34:45.</p></div>'+
    '<div class="card"><h2>Effort guide</h2><table class="gtable"><tbody>'+
      [["Easy run","5:50 to 6:20 /km, full sentences"],["Tempo run","4:50 to 4:55 /km"],["10k effort","4:40 to 4:45 /km"],["Race pace run","5:00 /km"],["Race pace bike","30 km/h, steady effort"],["Race pace swim","2:00 /100 m"]]
        .map(([a,b])=>'<tr><td>'+a+'</td><td class="num">'+b+'</td></tr>').join("")+
      '</tbody></table><p class="muted" style="margin:0;font-size:.82rem">Set from the 47:21 10k and 1:48 half marathon. Adjust by feel and heart rate.</p></div>'+
    '<div class="card" style="grid-column:1/-1"><h2>Tests and checkpoints</h2><div style="overflow-x:auto"><table class="gtable" style="min-width:560px"><thead><tr><th>Date</th><th>Wk</th><th>Test</th><th>Pass mark</th><th></th></tr></thead><tbody>'+testRows+'</tbody></table></div>'+
      '<p class="muted" style="margin:0;font-size:.82rem">If two tests in a row come in well short, reset the target at that point. The week 20 run test decides between the '+GOAL+' target and the 5:34:45 fallback.</p></div>'+
    '<div class="card" style="grid-column:1/-1"><h2>Strength by phase</h2><div style="overflow-x:auto"><table class="gtable" style="min-width:560px"><thead><tr><th></th><th>Monday: upper body and core</th><th>Thursday: legs and core</th></tr></thead><tbody>'+
      '<tr><td><b>Base</b>, wk 2 to 9</td><td>'+UPPER_EX.join(", ")+'</td><td>'+LEGS_EX.join(", ")+'</td></tr>'+
      '<tr><td><b>Build</b>, wk 10 to 17</td><td colspan="2">35 min. Same lifts, heavier, 6 to 8 reps. Two sets in lighter weeks.</td></tr>'+
      '<tr><td><b>Peak</b>, wk 18 to 24</td><td colspan="2">25 to 30 min. Two sets, hold the weights.</td></tr>'+
      '<tr><td><b>Taper</b>, wk 25 to 26</td><td colspan="2">15 to 20 min mobility and core only. Add no new exercises in the last three weeks.</td></tr>'+
      '</tbody></table></div><p class="muted" style="margin:0;font-size:.82rem">Week 1 is mobility only. Dumbbells and a bench.</p></div>'+
    '<div class="card"><h2>Core circuit and knee care</h2><ul><li><b>After Tuesday’s ride, 2 rounds:</b> dead bug 8 each side, plank 30 s, side plank 30 s each side, glute bridge 12.</li><li>Keep the knees tracking over the toes on squats and split squats.</li><li>If a knee niggle lasts more than 7 days, book a physio.</li></ul></div>'+
    '<div class="card"><h2>Fuelling</h2><ul><li>60 to 80 g carbohydrate per hour on the bike and run, 500 to 750 ml fluid per hour, more in heat.</li><li>Bulk Nutrients maltodextrin and fructose mix, INFINIT as backup. Test on every Sunday ride from week 10.</li><li>Race morning: a familiar breakfast 2 to 3 hours before the start. Nothing new on race day.</li></ul></div>'+
    '<div class="card"><h2>Race-day pacing</h2><ul><li><b>Swim:</b> 2:05 /100 m for the first 300 m, then settle at 2:00.</li><li><b>Bike:</b> hold 30 km/h, steady effort, no surges on climbs or in the first 20 km.</li><li><b>Run:</b> first 3 km at 5:05 to 5:10 /km, then 5:00 /km. Push only in the last 5 km.</li></ul></div>'+
    '<div class="card"><h2>Gear to organise</h2><ul class="gear">'+GEAR.map(g=>'<li class="'+(gear[g.id]?'done':'')+'">'+checkBtn(!!gear[g.id],"toggle-gear",'data-id="'+g.id+'"',g.text)+'<span>'+esc(g.text)+'</span></li>').join("")+'</ul></div>'+
    '<div class="card"><h2>Ground rules</h2><ul><li>No full rest day. Core work three times a week protects the knees.</li><li>Mon and Thu strength can swap. Keep the Saturday long run and Sunday long ride back to back.</li><li>Do not make up a missed session. If a week goes wrong, shorten Tuesday’s ride first.</li><li>Never drop the long run or long ride two weeks in a row.</li><li>Lighter weeks (5, 9, 13, 17, 21): do not add training.</li><li>Ease off for the week if something changes how you move. Skip the Sunday brick run if a knee flares.</li></ul></div>'+
  '</div>';
}

function renderTraining(){
  const t = todayISO(), pos = planPos(t);
  if(state.ui.week == null) state.ui.week = pos.week || (pos.before ? 1 : WEEKS);
  const w = state.ui.week, tv = state.ui.tview || "week";
  const daysToRace = Math.round((toUTC(state.settings.raceDate) - toUTC(t))/DAY);
  const start = planStart(), race = state.settings.raceDate;
  const body = tv==="plan" ? planTableHTML(pos) : tv==="guide" ? guideHTML(t) : weekHTML(w, t, pos);
  view.innerHTML = '<div class="page wide">'+
    '<div class="page-head"><div><h1>'+esc(state.settings.raceName)+' training plan</h1>'+
      '<p class="muted mono" style="font-size:.8rem;text-transform:uppercase">'+WEEKS+' weeks, Mon '+shortDate(start)+' '+yearOf(start)+' to race day Sun '+shortDate(race)+' '+yearOf(race)+'</p></div>'+
      '<div class="row"><span class="pill">Goal <b class="num" style="color:var(--ink)">'+GOAL+'</b></span>'+(daysToRace>=0?'<span class="pill num">'+daysToRace+' days to go</span>':'')+'</div></div>'+
    glanceHTML(w, pos)+
    '<div class="seg" role="group" aria-label="Plan view" style="align-self:flex-start">'+
      [["week","Week"],["plan","Full plan"],["guide","Guide"]].map(([k,l])=>'<button type="button" data-action="tview" data-v="'+k+'" aria-pressed="'+(tv===k)+'">'+l+'</button>').join("")+
    '</div>'+ body +
  '</div>';
}

function byDue(a,b){ if(a.due && b.due) return a.due<b.due?-1:a.due>b.due?1:a.created-b.created; if(a.due) return -1; if(b.due) return 1; return a.created-b.created; }
function dueTag(due){
  if(!due) return "";
  const t = todayISO(), diff = Math.round((toUTC(due)-toUTC(t))/DAY);
  const txt = diff===0?"Today":diff===1?"Tomorrow":diff===-1?"Yesterday":diff<0?Math.abs(diff)+" days late":shortDate(due);
  return '<span class="due num'+(diff<0?' overdue':'')+'">'+txt+'</span>';
}

function renderTodo(){
  const list = state.ui.todoList;
  const items = state.todos.filter(x=>x.list===list);
  const open = items.filter(x=>!x.done).sort(byDue), done = items.filter(x=>x.done);
  const cnt = l => state.todos.filter(x=>x.list===l && !x.done).length;
  const li = x => {
    if(state.ui.editTodo===x.id) return '<li class="editing"><form class="edit-form" id="todo-edit-form" data-id="'+x.id+'" autocomplete="off">'+
      '<input type="text" id="edit-text" value="'+esc(x.text)+'" aria-label="Task" required>'+
      '<input type="date" id="edit-due" value="'+esc(x.due||"")+'" aria-label="Due date (leave empty for none)">'+
      '<select id="edit-list" aria-label="List"><option value="personal"'+(x.list==="personal"?' selected':'')+'>Personal</option><option value="work"'+(x.list==="work"?' selected':'')+'>Work</option></select>'+
      '<button class="btn small primary" type="submit">Save</button>'+
      '<button class="btn small ghost" type="button" data-action="cancel-edit">Cancel</button></form></li>';
    return '<li class="'+(x.done?'done':'')+'">'+checkBtn(x.done,"toggle-todo",'data-id="'+x.id+'"',(x.done?"Reopen ":"Complete ")+x.text)+
    '<button type="button" class="t" data-action="edit-todo" data-id="'+x.id+'" title="Edit task">'+esc(x.text)+(x.sample?' <span class="pill sample">Example</span>':'')+'</button>'+dueTag(x.due)+
    '<button class="iconbtn" type="button" data-action="edit-todo" data-id="'+x.id+'" aria-label="Edit '+esc(x.text)+'">'+ICON_EDIT+'</button>'+
    '<button class="iconbtn" type="button" data-action="del-todo" data-id="'+x.id+'" aria-label="Delete '+esc(x.text)+'">'+ICON_X+'</button></li>';
  };

  view.innerHTML = '<div class="page">'+
    '<div class="page-head"><div><h1>To Do</h1><p class="muted">Two lists, kept apart.</p></div>'+
      '<div class="seg" role="group" aria-label="List">'+
        '<button type="button" data-action="pick-list" data-list="personal" aria-pressed="'+(list==="personal")+'">Personal <span class="num muted">'+cnt("personal")+'</span></button>'+
        '<button type="button" data-action="pick-list" data-list="work" aria-pressed="'+(list==="work")+'">Work <span class="num muted">'+cnt("work")+'</span></button>'+
      '</div></div>'+
    '<form class="card todo-form" id="todo-form" autocomplete="off">'+
      '<input type="text" id="todo-text" placeholder="Add a '+list+' task…" aria-label="Task" required>'+
      '<input type="date" id="todo-due" aria-label="Due date">'+
      '<button class="btn primary" type="submit">Add</button>'+
    '</form>'+
    '<div class="card">'+(open.length?'<ul class="todo-list">'+open.map(li).join("")+'</ul>':'<div class="empty">Nothing open on your '+list+' list.</div>')+'</div>'+
    (done.length?'<div class="card"><div class="row between" style="margin-bottom:6px"><span class="label">Completed · '+done.length+'</span><button class="btn small ghost" type="button" data-action="clear-done">Clear completed</button></div><ul class="todo-list">'+done.map(li).join("")+'</ul></div>':'')+
  '</div>';
}

function renderFinance(){
  const t = todayISO();
  if(!state.ui.month) state.ui.month = t.slice(0,7);
  const ym = state.ui.month, mt = monthTotals(ym), txs = monthTx(ym).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0);
  const cats = {}; txs.filter(x=>x.type==="expense").forEach(x=>cats[x.category]=(cats[x.category]||0)+x.amount);
  const catRows = Object.entries(cats).sort((a,b)=>b[1]-a[1]); const max = catRows.length?catRows[0][1]:1;
  const type = state.ui.txType, catOpts = (type==="income"?INC_CATS:EXP_CATS).map(c=>'<option>'+esc(c)+'</option>').join("");
  const prevYm = shiftMonth(ym,-1), prev = monthTotals(prevYm);

  view.innerHTML = '<div class="page">'+
    '<div class="page-head"><div><h1>PekFinance</h1><p class="muted">Income and spending by month.</p></div>'+
      '<div class="row"><button class="iconbtn" type="button" data-action="month-prev" aria-label="Previous month">'+ICON_L+'</button>'+
      '<b style="min-width:9.5em;text-align:center">'+monthLabel(ym)+'</b>'+
      '<button class="iconbtn" type="button" data-action="month-next" aria-label="Next month">'+ICON_R+'</button></div></div>'+
    '<div class="card"><div class="stats">'+
      '<div class="stat"><span class="label">Income</span><span class="v num">'+money(mt.inc)+'</span></div>'+
      '<div class="stat"><span class="label">Spent</span><span class="v num">'+money(mt.exp)+'</span>'+(prev.exp?'<span class="muted num" style="font-size:.8rem">'+money(prev.exp)+' in '+MON[Number(prevYm.slice(5))-1]+'</span>':'')+'</div>'+
      '<div class="stat"><span class="label">Net</span><span class="v num '+(mt.net>=0?'pos':'neg')+'">'+money(mt.net)+'</span>'+(mt.inc?'<span class="muted num" style="font-size:.8rem">'+Math.round(mt.net/mt.inc*100)+'% saved</span>':'')+'</div>'+
    '</div></div>'+
    '<form class="card fin-form" id="tx-form" autocomplete="off">'+
      '<div class="seg" role="group" aria-label="Type"><button type="button" data-action="tx-type" data-type="expense" aria-pressed="'+(type==="expense")+'">Expense</button><button type="button" data-action="tx-type" data-type="income" aria-pressed="'+(type==="income")+'">Income</button></div>'+
      '<input type="number" id="tx-amount" step="0.01" min="0" placeholder="Amount" aria-label="Amount" required>'+
      '<select id="tx-cat" aria-label="Category">'+catOpts+'</select>'+
      '<input type="text" id="tx-note" placeholder="Note (optional)" aria-label="Note">'+
      '<input type="date" id="tx-date" value="'+(ym===t.slice(0,7)?t:ym+"-01")+'" aria-label="Date" required>'+
      '<button class="btn primary" type="submit">Add</button>'+
    '</form>'+
    '<div class="grid">'+
      '<div class="card"><span class="label">Spending by category</span><div class="bars" style="margin-top:14px">'+
        (catRows.length?catRows.map(([c,v])=>'<div class="bar-row"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(c)+'</span><div class="bar-track"><div class="bar-fill" style="width:'+(v/max*100)+'%"></div></div><span class="num" style="text-align:right">'+money(v)+'</span></div>').join(""):'<div class="empty">No spending recorded this month.</div>')+
      '</div></div>'+
      '<div class="card"><span class="label">Transactions · '+txs.length+'</span><div class="tx-wrap" style="margin-top:8px">'+
        (txs.length?'<table class="tx-table"><tbody>'+txs.map(x=>'<tr><td class="num muted" style="white-space:nowrap">'+shortDate(x.date)+'</td><td><div>'+esc(x.note||x.category)+(x.sample?' <span class="pill sample">Example</span>':'')+'</div><div class="muted" style="font-size:.8rem">'+esc(x.category)+'</div></td><td class="amt num" style="color:'+(x.type==="income"?"var(--good)":"var(--ink)")+'">'+(x.type==="income"?"+":"−")+money(x.amount)+'</td><td style="width:32px"><button class="iconbtn" type="button" data-action="del-tx" data-id="'+x.id+'" aria-label="Delete transaction">'+ICON_X+'</button></td></tr>').join("")+'</tbody></table>':'<div class="empty">No transactions. Add one above.</div>')+
      '</div></div>'+
    '</div>'+
  '</div>';
}

/* ---------- settings ---------- */
const overlayRoot = document.getElementById("overlay-root");
function openSettings(){
  const s = state.settings;
  overlayRoot.innerHTML = '<div class="overlay" data-action="close-settings-bg"><form class="sheet" id="settings-form" role="dialog" aria-modal="true" aria-labelledby="set-h">'+
    '<div class="row between"><h2 id="set-h">Settings</h2><button class="iconbtn" type="button" data-action="close-settings" aria-label="Close">'+ICON_X+'</button></div>'+
    '<label class="field"><span class="label">Race name</span><input type="text" id="set-race-name" value="'+esc(s.raceName)+'"></label>'+
    '<label class="field"><span class="label">Race date</span><input type="date" id="set-race-date" value="'+s.raceDate+'"><span class="muted" style="font-size:.8rem">The 26-week plan counts back from this date (Sunday of week 26).</span></label>'+
    '<label class="field"><span class="label">Currency</span><select id="set-currency">'+Object.entries(CURRENCIES).map(([k,v])=>'<option value="'+k+'"'+(k===s.currency?' selected':'')+'>'+v+'</option>').join("")+'</select></label>'+
    '<button class="btn primary" type="submit">Save settings</button>'+
    '<div style="border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px">'+
      '<span class="label">Your data</span><p class="muted" style="margin:0;font-size:.85rem">Everything is saved in this browser only. Export a backup before switching devices.</p>'+
      '<div class="row"><button class="btn small" type="button" data-action="export">Export backup</button>'+
      '<label class="btn small" for="import-file" style="cursor:pointer">Import backup</label><input type="file" id="import-file" accept="application/json" hidden></div>'+
      '<div class="row"><button class="btn small" type="button" data-action="clear-samples">Remove example items</button>'+
      '<button class="btn small danger" type="button" data-action="reset-all" id="reset-btn">Reset everything</button></div>'+
    '</div></form></div>';
  document.getElementById("set-race-name").focus();
}
function closeSettings(){ overlayRoot.innerHTML = ""; }

let toastTimer;
function toast(msg){
  let el = document.querySelector(".toast"); if(!el){ el = document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ el.hidden = true; }, 2200);
}

/* ---------- routing ---------- */
const ROUTES = {today:renderToday, training:renderTraining, todo:renderTodo, finance:renderFinance};
function route(){ return (location.hash||"").slice(1) in ROUTES ? location.hash.slice(1) : "today"; }
function render(){
  const r = route(); ROUTES[r]();
  document.querySelectorAll(".nav a").forEach(a => a.getAttribute("data-route")===r ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
}
window.addEventListener("hashchange", () => { render(); window.scrollTo(0,0); });

/* ---------- events ---------- */
let resetArmed = false;
document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]"); if(!el) return;
  const a = el.dataset.action;
  if(a==="close-settings-bg" && e.target!==el) return;
  switch(a){
    case "toggle-session": { const k = doneKey(el.dataset.w, el.dataset.d); if(state.training.done[k]) delete state.training.done[k]; else state.training.done[k] = Date.now(); save("training"); render(); break; }
    case "open-week": state.ui.week = Number(el.dataset.w); state.ui.tview = "week"; render(); break;
    case "tview": state.ui.tview = el.dataset.v; render(); break;
    case "toggle-gear": { const g = state.training.gear; g[el.dataset.id] = !g[el.dataset.id]; save("training"); render(); break; }
    case "week-prev": state.ui.week = Math.max(1, state.ui.week-1); render(); break;
    case "week-next": state.ui.week = Math.min(WEEKS, state.ui.week+1); render(); break;
    case "week-now": state.ui.week = planPos(todayISO()).week; render(); break;
    case "pick-list": state.ui.todoList = el.dataset.list; state.ui.editTodo = null; render(); break;
    case "toggle-todo": { const x = state.todos.find(t=>t.id===el.dataset.id); if(x){ x.done=!x.done; save("todos"); render(); } break; }
    case "edit-todo": state.ui.editTodo = el.dataset.id; render(); { const i = document.getElementById("edit-text"); if(i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } } break;
    case "cancel-edit": state.ui.editTodo = null; render(); break;
    case "del-todo": state.todos = state.todos.filter(t=>t.id!==el.dataset.id); save("todos"); render(); toast("Task deleted"); break;
    case "clear-done": state.todos = state.todos.filter(t=>!(t.done && t.list===state.ui.todoList)); save("todos"); render(); toast("Completed tasks cleared"); break;
    case "month-prev": state.ui.month = shiftMonth(state.ui.month,-1); render(); break;
    case "month-next": state.ui.month = shiftMonth(state.ui.month,1); render(); break;
    case "tx-type": state.ui.txType = el.dataset.type; render(); break;
    case "del-tx": state.tx = state.tx.filter(t=>t.id!==el.dataset.id); save("tx"); render(); toast("Transaction deleted"); break;
    case "open-settings": openSettings(); break;
    case "close-settings": case "close-settings-bg": closeSettings(); break;
    case "export": {
      const data = JSON.stringify({app:"MyEverythingApp", version:1, exported:new Date().toISOString(), settings:state.settings, training:state.training, todos:state.todos, tx:state.tx}, null, 2);
      try{ const url = URL.createObjectURL(new Blob([data],{type:"application/json"})); const l = document.createElement("a"); l.href=url; l.download="myeverythingapp-backup-"+todayISO()+".json"; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(url),1000); toast("Backup exported"); }
      catch(err){ toast("Export isn’t available here"); }
      break;
    }
    case "clear-samples": state.todos = state.todos.filter(t=>!t.sample); state.tx = state.tx.filter(t=>!t.sample); save("todos"); save("tx"); closeSettings(); render(); toast("Example items removed"); break;
    case "reset-all":
      if(!resetArmed){ resetArmed = true; el.textContent = "Tap again to erase all data"; setTimeout(()=>{ resetArmed=false; const b=document.getElementById("reset-btn"); if(b) b.textContent="Reset everything"; }, 4000); break; }
      resetArmed = false; state.training = {done:{}, gear:{}}; state.todos = []; state.tx = []; save("training"); save("todos"); save("tx"); closeSettings(); render(); toast("All data erased"); break;
  }
});

document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  if(f.id==="todo-edit-form"){
    const x = state.todos.find(t=>t.id===f.dataset.id); const text = document.getElementById("edit-text").value.trim();
    if(!x || !text) return;
    const newList = document.getElementById("edit-list").value, moved = newList!==x.list;
    Object.assign(x, {text, due:document.getElementById("edit-due").value, list:newList, sample:false});
    state.ui.editTodo = null; save("todos"); render();
    toast(moved ? "Moved to "+(newList==="work"?"Work":"Personal") : "Task updated");
  } else if(f.id==="todo-form"){
    const text = document.getElementById("todo-text").value.trim(); if(!text) return;
    state.todos.push({id:uid(), list:state.ui.todoList, text, due:document.getElementById("todo-due").value, done:false, created:Date.now()});
    save("todos"); render(); document.getElementById("todo-text").focus();
  } else if(f.id==="tx-form"){
    const amount = parseFloat(document.getElementById("tx-amount").value); if(!(amount>0)) return;
    const date = document.getElementById("tx-date").value || todayISO();
    state.tx.push({id:uid(), type:state.ui.txType, amount:Math.round(amount*100)/100, category:document.getElementById("tx-cat").value, note:document.getElementById("tx-note").value.trim(), date});
    save("tx"); state.ui.month = date.slice(0,7); render(); toast((state.ui.txType==="income"?"Income":"Expense")+" added");
  } else if(f.id==="settings-form"){
    const rd = document.getElementById("set-race-date").value;
    if(rd) state.settings.raceDate = rd;
    state.settings.raceName = document.getElementById("set-race-name").value.trim() || "Ironman 70.3";
    state.settings.currency = document.getElementById("set-currency").value;
    save("settings"); state.ui.week = null; closeSettings(); render(); toast("Settings saved");
  }
});

document.addEventListener("change", e => {
  if(e.target.id!=="import-file" || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result); if(d.app!=="MyEverythingApp") throw 0;
      ["settings","training","todos","tx"].forEach(k=>{ if(d[k]){ state[k]=d[k]; save(k); } });
      state.ui.week = null; closeSettings(); render(); toast("Backup imported");
    }catch(err){ toast("That file isn’t a MyEverythingApp backup"); }
  };
  r.readAsText(e.target.files[0]);
});
document.addEventListener("keydown", e => {
  if(e.key!=="Escape") return;
  if(overlayRoot.firstChild) closeSettings();
  else if(state.ui.editTodo){ state.ui.editTodo = null; render(); }
});

render();

/* ---------- offline support when hosted (no-op where service workers aren't allowed) ---------- */
try{ if("serviceWorker" in navigator && location.protocol==="https:" && document.querySelector('link[rel=manifest]')) navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
})();
</script>
<!--APP-END-->
</body>
</html>
